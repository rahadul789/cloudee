<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alpha SMS API Test</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 20px;
      }

      input,
      textarea {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        font-size: 15px;
        box-sizing: border-box;
      }

      button {
        padding: 12px 20px;
        cursor: pointer;
        font-size: 16px;
      }

      pre {
        background: #f4f4f4;
        padding: 15px;
        white-space: pre-wrap;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <h2>Alpha SMS API Tester</h2>

    <label>API Key</label>
    <input
      id="api_key"
      placeholder="Paste API Key"
      value="4y78omHf45sV0gwpF67lOSpNiwdF7f654OytlKM3"
    />

    <label>Phone Number</label>
    <input id="to" value="01987296298" />

    <label>Message</label>
    <textarea id="msg">Your OTP is 123456</textarea>

    <label>Sender ID (Optional)</label>
    <input id="sender_id" />

    <button onclick="sendSMS()">Send SMS</button>

    <h3>Response</h3>
    <pre id="result"></pre>

    <script>
      async function sendSMS() {
        const body = {
          api_key: document.getElementById("api_key").value,
          to: document.getElementById("to").value,
          msg: document.getElementById("msg").value,
        };

        const sender = document.getElementById("sender_id").value.trim();

        if (sender) {
          body.sender_id = sender;
        }

        try {
          const response = await fetch("https://api.sms.net.bd/sendsms", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(body),
          });

          const text = await response.text();

          document.getElementById("result").textContent = text;
        } catch (err) {
          document.getElementById("result").textContent = "Error:\n" + err;
        }
      }
    </script>
  </body>
</html>
